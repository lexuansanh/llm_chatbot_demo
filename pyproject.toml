[tool.black]
line-length = 88 # Maximum line length Black's default style

[tool.isort]
profile = "black" # Use the "black" profile
line_length = 88 # Maximum line length Black's default style
include_trailing_comma = true # Include trailing commas wherever possibl
multi_line_output = 3 # Use vertical hanging indent style for multi-line imports
force_grid_wrap = 0 # Disable grid wrapping of imports
